name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Syntax check Worker JS
        run: |
          for f in src/index.js functions/api/_affiliate-auth.js functions/api/_crypto-utils.js functions/api/_email.js functions/api/affiliate/login.js functions/api/affiliate/me.js functions/api/affiliate/logout.js functions/api/admin/_gate.js functions/api/admin/affiliates.js functions/api/admin/affiliate-approve.js functions/api/admin/conversions.js functions/api/admin/conversion-approve.js functions/api/admin/payouts-run.js; do
            cp "$f" /tmp/chk.mjs && node --check /tmp/chk.mjs || exit 1
          done
