name: CI

on:
  push:
    branches: [master, affiliate-program]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Syntax check Worker JS
        run: |
          for f in src/index.js functions/api/checkout.js functions/api/stripe-webhook.js functions/api/free-checkout.js functions/api/_email.js functions/api/_affiliate-auth.js; do
            [ -f "$f" ] || continue
            cp "$f" /tmp/chk.mjs && node --check /tmp/chk.mjs || exit 1
          done
